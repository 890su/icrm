# Merge of duplicates (spec 2a §6): records that link to contacts and memberships, contacts with rows.
fields:
  assigned: {type: link, label: Закреплено за, target_sets: [contact], cardinality: one, inverse_label: Имущество}
  kit: {type: link, label: Выдано участию, target_sets: [membership], cardinality: one, inverse_label: Выданное}
  sponsor: {type: link, label: Спонсор, target_sets: [vip], cardinality: one, inverse_label: Спонсирует}
  user_of: {type: link, label: Пользователь, target_sets: [contact], cardinality: one, inverse_label: Учётные записи}
  locked: {type: bool, label: Заблокирована}
  devices: {type: link, label: Устройства, target_sets: [device], cardinality: many, owned: true, inverse_label: Владелец}
  serial: {type: text, label: Серийный номер}
  friends: {type: link, label: Знакомые, target_sets: [contact], cardinality: many, inverse_label: Знаком с}
  referrer: {type: link, label: Кто привёл, target_sets: [contact], cardinality: one, inverse_label: Привёл}
  vip_level: {type: number, label: Уровень VIP}
sets:
  asset: {label: Имущество, fields: [assigned, kit, sponsor]}
  account: {label: Учётная запись, fields: [user_of, locked]}
  device: {label: Устройство, fields: [serial]}
  vip: {label: VIP, fields: [vip_level]}
extend:
  sets:
    contact: {fields: [devices, friends, referrer]}
rules:
  # A merge enables the set on B together with A's values of its own fields, or this would fail.
  - id: vip_level_required
    when: 'HAS_SET("vip")'
    require: [vip_level]
  - id: locked_account_frozen
    when: '{locked}'
    readonly: [user_of]
