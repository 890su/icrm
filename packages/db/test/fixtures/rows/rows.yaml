# Record rows (spec §1.12): a task owns expense rows; totals over rows, owner values inside rows.
fields:
  rate: {type: number, label: Ставка}
  expenses:
    type: link
    label: Расходы
    target_sets: [expense]
    cardinality: many
    owned: true
    inverse_label: Задача
  primary_expense:
    type: link
    label: Основной расход
    target_sets: [expense]
    cardinality: one
    owned: true
    inverse_label: Задача (основной расход)
  expenses_total: {type: rollup, label: Сумма расходов, via: expenses, field: amount, agg: sum}
  transport_total:
    type: rollup
    label: Транспортные расходы
    via: expenses
    field: amount
    agg: sum
    filter: '{expense_kind} = "транспортные"'
  expense_kind: {type: enum, label: Вид расхода, options: [транспортные, комплектующие]}
  amount: {type: number, label: Сумма}
  note: {type: text, label: Примечание}
  task_rate: {type: rollup, label: Ставка задачи, via: expenses, direction: inverse, field: rate, agg: first}
  cost: {type: formula, label: Стоимость, expr: '{amount} * {task_rate}'}
  distance_km: {type: number, label: 'Расстояние, км'}
  budget_lines:
    type: link
    label: Строки бюджета
    target_sets: [expense]
    owned: true
    inverse_label: Бюджет
  memo: {type: text, label: Памятка}
  task_note: {type: text, label: Обоснование расходов}
  closed: {type: bool, label: Закрыта}
sets:
  task: {label: Задача, fields: [title, rate, expenses, primary_expense, expenses_total, transport_total, task_note, closed]}
  expense: {label: Расход, fields: [expense_kind, amount, note, task_rate, cost]}
  expense_transport:
    label: Транспортный расход
    activation: rule
    requires: [expense]
    fields: [distance_km]
  budget: {label: Бюджет, fields: [budget_lines]}
  memo: {label: Памятка, fields: [memo]}
rules:
  - id: transport_fields
    when: '{expense_kind} = "транспортные"'
    enable_set: expense_transport
  - id: expense_amount_required
    when: 'HAS_SET("expense")'
    require: [amount]
  # A row rule over a value substituted from the owner: new rows must see the owner while evaluated.
  - id: big_expense_cost_known
    when: 'HAS_SET("expense") AND {amount} >= 1000'
    require: [cost]
  # An owner rule over a total of its rows: fails only after the rows are written.
  - id: big_total_needs_note
    when: '{expenses_total} > 5000'
    require: [task_note]
  # Readonly on an owned field freezes its membership (judged by the owner's stored state).
  - id: closed_task_frozen
    when: '{closed}'
    readonly: [expenses]
