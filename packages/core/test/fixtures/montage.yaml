fields:
  kind: {type: enum, label: Вид работ, options: [visit, montage, consult]}
  done: {type: bool, label: Выполнена}
  start: {type: date, label: Начало}
  end: {type: date, label: Конец}
  payment: {type: enum, label: Оплата, options: [cash, transfer, card]}
  invoice_no: {type: text, label: Номер фактуры}
  hours: {type: number, label: Часы}
  rate: {type: number, label: Ставка}
  address: {type: text, label: Адрес}
  warranty_months: {type: number, label: 'Гарантия, мес.'}
  act_file: {type: file, label: Акт}
  # Entered by hand (it is readonly once the job is done); the computed estimate is labor_cost.
  work_cost: {type: number, label: Стоимость работ}
  labor_cost: {type: formula, label: Расчётная стоимость, expr: '{hours} * {rate}'}
  notes: {type: text, label: Заметки}
sets:
  task: {label: Задача, fields: [title, kind, done, start, end, payment, invoice_no, hours, rate]}
  montage:
    label: Монтаж
    activation: rule
    requires: [task]
    fields: [address, warranty_months, act_file, work_cost, labor_cost]
  contact: {label: Контакт, fields: [notes]}
rules:
  - id: montage_by_kind
    when: '{kind} = "montage"'
    enable_set: montage
  - id: act_required_on_done
    when: '{done} AND HAS_SET("montage")'
    require: [act_file]
    readonly: [work_cost]
  - id: dates_order
    when: 'NOT(IS_EMPTY({start})) AND NOT(IS_EMPTY({end}))'
    validate: '{end} >= {start}'
    message: Конец раньше начала
  - id: warranty_default
    when: 'HAS_SET("montage")'
    default: {warranty_months: '12'}
  - id: invoice_on_transfer
    when: '{payment} = "transfer"'
    show: [invoice_no]
  - id: visit_payment
    when: '{kind} = "visit"'
    options: {payment: [cash, card]}
