# Local development database only. Dev-only credentials; never use them anywhere else.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: icrm
      # Filters compare text case-insensitively in SQL (Cyrillic included), which needs a UTF-8 ctype.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d icrm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata-dev:
